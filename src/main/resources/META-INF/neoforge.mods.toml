modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies."${mod_id}"]]
modId="neoforge"
mandatory=true
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies."${mod_id}"]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

# Hard dependency (arch decision §7): without Sable there is no ship and no core.
[[dependencies."${mod_id}"]]
modId="sable"
mandatory=true
versionRange="[2.0.3,)"
ordering="AFTER"
side="BOTH"

# Soft dependency: channel-table and display peripherals register only when CC is present.
# FML 4 reads type; the legacy mandatory=false alone silently defaults to REQUIRED.
[[dependencies."${mod_id}"]]
modId="computercraft"
type="optional"
versionRange="[1.120.0,)"
ordering="AFTER"
side="BOTH"

# Mixin configs (each entry gated by BridgeCoreMixinPlugin on its optional target).
[[mixins]]
config="bridgecore.mixins.json"
