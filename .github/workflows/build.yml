name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare build-only dependencies
        run: bash .github/scripts/prepare-devlibs.sh

      - name: Build and test
        run: ./gradlew build
        env:
          GRADLE_OPTS: -Dfile.encoding=UTF-8

      - name: Upload BridgeCore JAR
        uses: actions/upload-artifact@v4
        with:
          name: bridgecore-${{ github.sha }}
          path: |
            build/libs/bridgecore-*.jar
            !build/libs/bridgecore-*-sources.jar
          if-no-files-found: error
